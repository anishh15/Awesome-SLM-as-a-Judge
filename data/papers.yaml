# data/papers.yaml: every work cited in "Small Language Models as Judges: A Survey"
#
# This file is the single source for the paper list in README.md and for the
# project website. Edit it here; never edit the generated parts of README.md.
#
#   python3 scripts/sync_bib.py --paper-dir PATH   # refresh bib fields from the paper
#   python3 scripts/build_readme.py                # rewrite the generated README blocks
#   python3 scripts/build_readme.py --check        # fail if README.md is out of date
#
# Top-level keys
#   corpus      Counts reported in the survey (App. M, Corpus Statistics). The build
#               script recomputes them from `papers` and stops if they differ.
#   categories  The five groups of App. M, in README order. Each has `groups`
#               (sub-headings that follow the survey's sections and tables).
#   papers      One entry per work.
#
# Paper fields (A = set by scripts/sync_bib.py from data/references.bib, H = by hand)
#   key         H  BibTeX key, the same as in the survey and data/references.bib
#   name        H  short name the survey uses for the system or benchmark (optional)
#   title       H  title as printed on the linked page; sync_bib.py warns if it
#                  stops matching the bib title (case and punctuation ignored)
#   authors     A  list of authors as given in the bib
#   et_al       A  true when the bib author list ends with "and others"
#   year        A  year as given in the bib
#   venue       A  short venue name derived from the bib (rules in sync_bib.py)
#   venue_full  A  booktitle or journal as given in the bib
#   category    H  id of one of the five categories below
#   group       H  id of a group inside that category
#   in_survey   H  omit for works the survey cites; set false for later additions
#   sections    A  where the survey cites the work (§ = main text, App. = appendix)
#   links       H  paper (ACL Anthology for ACL venues, OpenReview for ICLR, else
#                  arXiv), arxiv (when `paper` is not arXiv), code, model
#   note        H  anything a reader should know about the citation (optional)
#
# The category of each work was assigned for this repository so that the counts
# match App. M; the survey reports the counts but does not list the works per
# category.

corpus:
  source: Survey, Appendix M (Corpus Statistics and Figure 15)
  total: 105
  categories:
    judge-systems: 29
    benchmarks-metrics: 20
    training-methodology: 26
    bias-robustness: 13
    foundational-models: 17
  years:
    2023 or earlier: 21
    '2024': 26
    '2025': 44
    '2026': 14

categories:
  - id: judge-systems
    title: Judge systems
    summary: Models and pipelines that act as judges, from prompted small models to trained, probed and multi-model judges.
    where: §3, §4, Table 9, App. C
    figure: 5_paradigm_scatter
    groups:
      - id: prompted
        title: Prompted judges and judges in applications
        where: §3.1, App. D, App. J
      - id: sft
        title: Supervised fine-tuned judges
        where: §3.1, Table 9, App. C
      - id: self-taught
        title: Self-taught and preference-calibrated judges
        where: Table 9, §5.1, App. C
      - id: rl
        title: Judges trained with reinforcement learning
        where: §3.1, Table 9, App. C
      - id: representation
        title: Representation-based judges
        where: §3.1, Table 9, App. C
      - id: multi-judge
        title: Panels, cascades and debate judges
        where: §4, App. E, App. G
  - id: benchmarks-metrics
    title: Benchmarks and metrics
    summary: Benchmarks that test judges and reward models, task benchmarks used in judge studies, and text evaluation metrics.
    where: §5.3, Table 24, App. I, App. J
    figure: 11_benchmark_coverage
    groups:
      - id: judge-benchmarks
        title: Judge and reward-model benchmarks
        where: §5.3, Table 24, App. I
      - id: task-benchmarks
        title: Task benchmarks used in judge studies
        where: App. C, App. I, App. J
      - id: metrics
        title: Text evaluation metrics
        where: App. A, App. H
  - id: training-methodology
    title: Training and methodology
    summary: Methods that judges are built on or run with, such as preference training, reasoning budgets, debate and calibration.
    where: §3.3, §4.2, §6, App. C, App. D, App. G, App. L
    figure: 6_paradigm_supervision
    groups:
      - id: alignment
        title: Alignment and reward modeling
        where: App. A, App. C
      - id: reasoning
        title: Reasoning budget and inference
        where: §3.3, App. D
      - id: debate
        title: Multi-agent debate
        where: §4.2, App. G
      - id: calibration
        title: Calibration and agreement with humans
        where: §6 (C2), App. L
  - id: bias-robustness
    title: Bias and robustness
    summary: Biases of model judges, attacks on them, and how personas change their verdicts.
    where: §5, App. H, App. K
    figure: 10_bias_heatmap
    groups:
      - id: biases
        title: Judge biases and validity
        where: §5.1, §5.3, App. H
      - id: robustness
        title: Adversarial robustness and persona effects
        where: §5.2, App. K
  - id: foundational-models
    title: Foundational and model reports
    summary: Related surveys of LLM judges and small language models, and the reports of the model families that SLM judges are built on.
    where: §1, Table 1, App. B
    figure: 4_family_heatmap
    groups:
      - id: surveys
        title: Related surveys
        where: §1, Table 1, App. A
      - id: models
        title: Model reports
        where: App. B

